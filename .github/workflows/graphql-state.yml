name: GraphQL state

# Runs the request-state gate for the worker (README, "Verification gate"):
# core GraphQlStateTest and friends plus this module's companion state tests
# (Test/Integration), in Magento's integration test framework, on a fresh
# Mage-OS install with every magenxcommerce module and Stripe enabled.
#
# Only the GraphQL area is under test: that is what the FrankenPHP worker
# serves; admin stays on PHP-FPM. PHP is the thread-safe (ZTS) build, as in
# the FrankenPHP image.
#
# Private module repos are cloned with the MAGENX_MODULES_TOKEN secret (a
# token with read access to magenxcommerce repositories). Without it only
# public modules are installed, and the cases of the missing ones are skipped.

on:
  pull_request:
  schedule:
    # Nightly: the companion modules change in their own repos.
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      mageos-version:
        description: 'Mage-OS version (mage-os/project-community-edition)'
        default: '3.5.0'
      modules-ref:
        description: 'Branch to take from each module repo when it exists (default branch otherwise)'
        default: ''

permissions:
  contents: read

concurrency:
  group: graphql-state-${{ github.ref }}
  cancel-in-progress: true

env:
  MAGEOS_VERSION: ${{ inputs.mageos-version || '3.5.0' }}
  MODULES_REF: ${{ inputs.modules-ref || '' }}
  MAGENTO_ROOT: ${{ github.workspace }}/magento
  STRIPE_TGZ: https://raw.githubusercontent.com/stripe/stripe-magento2-releases/master/stripe-magento2-latest.tgz

jobs:
  state:
    name: State tests (Mage-OS, PHP 8.4 ZTS)
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: magento_integration_tests
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
        ports: ['9200:9200']
        options: >-
          --health-cmd="curl -fs http://localhost:9200/_cluster/health"
          --health-interval=10s --health-timeout=5s --health-retries=30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: module

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        env:
          phpts: ts
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, ftp, gd, hash, iconv, intl, mbstring, openssl, pdo_mysql, simplexml, soap, sockets, sodium, xsl, zip
          ini-values: memory_limit=-1, max_execution_time=0
          coverage: none
          tools: composer:v2

      - name: Cache composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-mageos-${{ env.MAGEOS_VERSION }}-php84
          restore-keys: composer-mageos-

      - name: Create Mage-OS project
        run: |
          composer create-project --no-install --no-interaction \
            --repository-url=https://repo.mage-os.org/ \
            "mage-os/project-community-edition=$MAGEOS_VERSION" "$MAGENTO_ROOT"
          composer --working-dir="$MAGENTO_ROOT" config repositories.mage-os composer https://repo.mage-os.org/

      - name: Fetch Stripe
        run: |
          curl -fsSL "$STRIPE_TGZ" | tar -xz -C "$MAGENTO_ROOT"
          ls "$MAGENTO_ROOT/app/code/StripeIntegration"

      # Discovered rather than listed, so a new module repo is tested without
      # editing this file. The worker serves every enabled module's GraphQL.
      - name: Fetch magenxcommerce modules
        env:
          GH_TOKEN: ${{ secrets.MAGENX_MODULES_TOKEN || github.token }}
          MODULES_TOKEN: ${{ secrets.MAGENX_MODULES_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          repos=$(gh repo list magenxcommerce --limit 300 --no-archived --json name --jq '.[].name' \
            | grep '^module-' | grep -vx 'module-graph-ql-app-server' | sort)
          echo "Module repositories visible: $(echo "$repos" | wc -l)"
          [ -n "$MODULES_TOKEN" ] || echo "::warning::MAGENX_MODULES_TOKEN is not set: private modules are not installed and their cases are skipped."

          auth=''
          [ -n "$MODULES_TOKEN" ] && auth="x-access-token:${MODULES_TOKEN}@"
          mkdir -p /tmp/modules
          for repo in $repos; do
            url="https://${auth}github.com/magenxcommerce/${repo}.git"
            if [ -n "$MODULES_REF" ] && git ls-remote --exit-code --heads "$url" "$MODULES_REF" >/dev/null 2>&1; then
              git clone -q --depth 1 --branch "$MODULES_REF" "$url" "/tmp/modules/$repo"
              echo "$repo @ $MODULES_REF"
            elif git clone -q --depth 1 "$url" "/tmp/modules/$repo" 2>/dev/null; then
              echo "$repo @ default branch"
            else
              echo "::warning::$repo could not be cloned; its cases are skipped."
            fi
          done

          # Into app/code/<Vendor>/<Module>, named from registration.php.
          install_module() {
            local name
            name=$(grep -oE "'[A-Za-z0-9]+_[A-Za-z0-9]+'" "$1/registration.php" | head -1 | tr -d "'")
            [ -n "$name" ] || { echo "::warning::$1 has no module registration"; return; }
            mkdir -p "$MAGENTO_ROOT/app/code/${name%%_*}/${name#*_}"
            tar -C "$1" --exclude=.git --exclude=.github -cf - . | tar -xf - -C "$MAGENTO_ROOT/app/code/${name%%_*}/${name#*_}"
            echo "  installed $name"
          }
          for dir in /tmp/modules/*/; do
            [ -f "$dir/registration.php" ] && install_module "${dir%/}"
          done
          install_module "$GITHUB_WORKSPACE/module"

      # Modules in app/code are not composer packages, so their third-party
      # requires (and the Stripe PHP library) are added to the project.
      - name: Add module dependencies
        working-directory: ${{ env.MAGENTO_ROOT }}
        run: |
          set -euo pipefail
          deps=$(php -r '
            $deps = [];
            foreach (glob("app/code/*/*/composer.json") as $file) {
                $json = json_decode((string) file_get_contents($file), true) ?: [];
                foreach ($json["require"] ?? [] as $package => $constraint) {
                    if ($package === "php" || str_starts_with($package, "ext-") || !str_contains($package, "/")
                        || preg_match("#^(magento|mage-os|magenxcommerce|stripe)/#", $package)) {
                        continue;
                    }
                    $deps[$package] = $constraint;
                }
            }
            foreach ($deps as $package => $constraint) {
                echo $package, ":", $constraint, "\n";
            }
          ')
          # The Stripe module checks the library version at runtime; its
          # install docs pin the major it was built against.
          stripe_php=$(grep -rhoE 'stripe/stripe-php:[~^][0-9.]+' app/code/StripeIntegration | head -1 | cut -d: -f2)
          mapfile -t packages < <(printf '%s\n' "$deps" "stripe/stripe-php:${stripe_php:-^20.1}" | grep -v '^$')
          printf '  %s\n' "${packages[@]}"
          composer require --no-update --no-interaction "${packages[@]}"

      - name: Install Mage-OS
        working-directory: ${{ env.MAGENTO_ROOT }}
        run: composer install --no-interaction --no-progress

      - name: Configure the integration test framework
        working-directory: ${{ env.MAGENTO_ROOT }}/dev/tests/integration
        run: |
          set -euo pipefail
          cat > etc/install-config-mysql.php <<'PHP'
          <?php
          return [
              'db-host' => '127.0.0.1',
              'db-user' => 'root',
              'db-password' => 'root',
              'db-name' => 'magento_integration_tests',
              'db-prefix' => '',
              'backend-frontname' => 'backend',
              'search-engine' => 'opensearch',
              'opensearch-host' => '127.0.0.1',
              'opensearch-port' => 9200,
              'admin-user' => \Magento\TestFramework\Bootstrap::ADMIN_NAME,
              'admin-password' => \Magento\TestFramework\Bootstrap::ADMIN_PASSWORD,
              'admin-email' => \Magento\TestFramework\Bootstrap::ADMIN_EMAIL,
              'admin-firstname' => \Magento\TestFramework\Bootstrap::ADMIN_FIRSTNAME,
              'admin-lastname' => \Magento\TestFramework\Bootstrap::ADMIN_LASTNAME,
              'consumers-wait-for-messages' => '0',
          ];
          PHP
          cp etc/config-global.php.dist etc/config-global.php
          php -r '
            $xml = file_get_contents("phpunit.xml.dist");
            $suites = <<<XML
            <testsuites>
                    <testsuite name="Magenx companion state">
                        <directory>../../../app/code/Magenx/AppServer/Test/Integration</directory>
                    </testsuite>
                    <testsuite name="Core GraphQl state">
                        <file>testsuite/Magento/GraphQl/App/GraphQlStateTest.php</file>
                        <file>testsuite/Magento/GraphQl/App/GraphQlCustomerMutationsTest.php</file>
                        <file>testsuite/Magento/GraphQl/App/GraphQlCheckoutMutationsStateTest.php</file>
                    </testsuite>
            XML;
            $xml = preg_replace("#<testsuites>#", $suites, $xml, 1, $count);
            $count === 1 || exit(1);
            file_put_contents("phpunit.xml", $xml);
          '
          php -r 'exit(simplexml_load_file("phpunit.xml") === false ? 1 : 0);'

      - name: Companion state tests
        working-directory: ${{ env.MAGENTO_ROOT }}/dev/tests/integration
        run: >-
          php ../../../vendor/bin/phpunit -c phpunit.xml
          --testsuite "Magenx companion state"
          --log-junit "$RUNNER_TEMP/companion-state.xml"
          --display-skipped

      - name: Core GraphQL state tests
        if: ${{ !cancelled() }}
        working-directory: ${{ env.MAGENTO_ROOT }}/dev/tests/integration
        # Reuse the test install of the previous step instead of reinstalling.
        run: >-
          sed -i 's/name="TESTS_CLEANUP" value="enabled"/name="TESTS_CLEANUP" value="disabled"/' phpunit.xml &&
          php ../../../vendor/bin/phpunit -c phpunit.xml
          --testsuite "Core GraphQl state"
          --log-junit "$RUNNER_TEMP/core-state.xml"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graphql-state-results
          path: |
            ${{ runner.temp }}/*.xml
            ${{ env.MAGENTO_ROOT }}/dev/tests/integration/tmp/sandbox-*/var/log/*.log
          if-no-files-found: ignore
