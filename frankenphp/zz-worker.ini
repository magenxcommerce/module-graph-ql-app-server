; PHP settings for the long-lived /graphql worker.
; Values follow the stack's php-fpm pool (php/config/fpm/www.conf and
; zz_override.ini) so Magento behaves the same on both backends.

expose_php = Off
display_errors = Off
log_errors = On
short_open_tag = On
default_charset = "UTF-8"
date.timezone = "${TIMEZONE}"

memory_limit = 1024M
max_execution_time = 30
max_input_vars = 50000
; GraphQL bodies are small; the worker refuses anything over
; MAGENX_WORKER_MAX_BODY_KB (default 512) and nginx replays it on php-fpm.
post_max_size = 2M
upload_max_filesize = 2M
realpath_cache_size = 4096k
realpath_cache_ttl = 86400

error_log = "${MAGENTO_ROOT_PATH}/${CURRENT_SYMLINK}/var/log/frankenphp-error.log"
upload_tmp_dir = "${MAGENTO_ROOT_PATH}/${CURRENT_SYMLINK}/var/tmp"
sys_temp_dir = "${MAGENTO_ROOT_PATH}/${CURRENT_SYMLINK}/var/tmp"
disable_functions = exec, shell_exec, system, passthru, popen, proc_open, phpinfo, show_source

[opcache]
opcache.enable = On
opcache.enable_cli = Off
opcache.validate_timestamps = Off
opcache.save_comments = On
; Sized for Magento: vendor + generated is well over 60k files. Opcache is
; shared by every worker thread; each worker logs its fill at boot and exit
; ("opcache N scripts ..."), with FULL when these need raising.
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 130987
opcache.max_wasted_percentage = 5
; Off: little gain for Magento's I/O-bound requests, and ZTS worker mode
; adds risk. Benchmark before turning it on.
opcache.jit = disable
opcache.jit_buffer_size = 0
opcache.error_log = "${MAGENTO_ROOT_PATH}/${CURRENT_SYMLINK}/var/log/opcache-error.log"

; MAGENX_WORKER_MAX_MEMORY_MB (default 512) must stay below memory_limit,
; so a slow leak ends in a clean worker recycle instead of a fatal error.
